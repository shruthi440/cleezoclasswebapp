<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Card Template 2</title>
  <style>
    :root{--bg:#d8ecf9;--blue:#2f67d4;--blue2:#2451a7;--ink:#0f172a;--muted:#51657b;--line:#d8e4f1}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#b6dbf3 0%,#e8f4fc 100%);
    }
    .page{
      width:760px;
      height:560px;
      margin:0 auto;
      padding:18px;
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .stack{
      display:grid;
      justify-items:center;
      gap:16px;
    }
    .lanyard{
      width:88px;
      height:72px;
      position:relative;
    }
    .lanyard:before{
      content:"";
      position:absolute;
      left:50%;
      top:0;
      transform:translateX(-50%);
      width:14px;
      height:40px;
      background:#244c8d;
      border-radius:0 0 8px 8px;
    }
    .lanyard:after{
      content:"";
      position:absolute;
      left:50%;
      top:28px;
      transform:translateX(-50%);
      width:70px;
      height:36px;
      border-top:10px solid #244c8d;
      border-left:10px solid transparent;
      border-right:10px solid transparent;
      border-radius:0 0 22px 22px;
    }
    .front,.back{
      width:252px;
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:0 18px 36px rgba(19,49,92,.18);
    }
    .front{
      min-height:356px;
      position:relative;
    }
    .front:before{
      content:"";
      position:absolute;
      inset:auto -20px 0 -20px;
      height:92px;
      background:linear-gradient(135deg,transparent 0 32%,#edf5ff 32% 100%);
    }
    .head{
      background:linear-gradient(180deg,var(--blue),#3d79ea);
      color:#fff;
      padding:8px 10px 12px;
      text-align:center;
    }
    .school{font-size:11px;font-weight:700}
    .mini{font-size:9px;opacity:.9}
    .photo{
      width:72px;
      height:88px;
      margin:8px auto 0;
      border:3px solid #fff;
      border-radius:5px;
      overflow:hidden;
      background:#dfe8f4;
      box-shadow:0 10px 18px rgba(18,50,92,.12);
    }
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .name{font-size:15px;font-weight:700;line-height:1.1;margin-top:8px;text-align:center}
    .chip{
      display:inline-block;
      margin:6px auto 0;
      padding:2px 8px;
      border-radius:999px;
      background:#2b58b5;
      color:#fff;
      font-size:9px;
      font-weight:700;
      letter-spacing:.04em;
    }
    .body{
      padding:8px 12px 12px;
      text-align:center;
    }
    .row{font-size:9px;line-height:1.42;color:#24415f;margin-top:4px}
    .row strong{color:#0f172a}
    .bottom{
      background:linear-gradient(180deg,#f5f8ff,#e9f1ff);
      padding:8px 10px 12px;
      text-align:center;
    }
    .sign{font-size:9px;color:#333;margin-top:8px}
    .back{
      margin-top:8px;
      min-height:144px;
    }
    .back .head{
      padding:8px 10px;
      font-size:10px;
      font-weight:700;
      text-align:left;
    }
    .back .body{
      text-align:left;
      padding:10px 12px;
      font-size:9px;
      line-height:1.45;
      color:#24415f;
    }
    .barcode{
      height:54px;
      margin-top:8px;
      border-radius:10px;
      background:
        repeating-linear-gradient(90deg,#18315f 0 3px,transparent 3px 6px),
        linear-gradient(180deg,#fff,#e9eef6);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="stack">
      <div class="lanyard"></div>
      <section class="front">
        <div class="head">
          <div class="school" data-school>School Name</div>
          <div class="mini">School Student ID</div>
        </div>
        <div class="body">
          <div class="photo"><img data-photo alt="Student photo" hidden></div>
          <div class="name" data-name>Student Name</div>
          <div class="chip">ID CARD</div>
          <div class="row">Student ID: <strong data-admission>--</strong></div>
          <div class="row">Father Name: <strong data-parent>--</strong></div>
          <div class="row">Class: <strong data-class>--</strong> | Sec <strong data-section>--</strong></div>
          <div class="row">Roll: <strong data-roll>--</strong></div>
          <div class="row">Blood Group: <strong data-blood>--</strong></div>
        </div>
        <div class="bottom"><div class="sign">Principal Signature</div></div>
      </section>
      <section class="back">
        <div class="head">Emergency / Rules</div>
        <div class="body">
          <div>Name: <strong data-name>--</strong></div>
          <div>Phone: <strong data-phone>--</strong></div>
          <div>Address: <strong data-address>--</strong></div>
          <div>Emergency: <strong data-emergency>--</strong></div>
          <div class="barcode"></div>
        </div>
      </section>
    </div>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    const set = (sel, val) => document.querySelectorAll(sel).forEach((n) => (n.textContent = val || "--"));
    const img = p.get("photo");
    if (img) {
      const el = document.querySelector("[data-photo]");
      if (el) {
        el.src = img;
        el.hidden = false;
      }
    }
    set("[data-school]", p.get("school"));
    set("[data-name]", p.get("name"));
    set("[data-class]", p.get("className"));
    set("[data-section]", p.get("section"));
    set("[data-admission]", p.get("admissionNo"));
    set("[data-roll]", p.get("rollNo"));
    set("[data-blood]", p.get("bloodGroup"));
    set("[data-phone]", p.get("phone"));
    set("[data-parent]", p.get("parent"));
    set("[data-address]", p.get("address"));
    set("[data-emergency]", p.get("emergency"));
    if (p.get("print") === "1") {
      window.addEventListener("load", () => setTimeout(() => window.print(), 250));
      window.addEventListener("afterprint", () => window.close());
    }
  </script>
  <script src="./idcard-common.js"></script>
</body>
</html>
