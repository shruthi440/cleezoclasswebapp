<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Card Template 6</title>
  <style>
    :root{--navy:#0f2f69;--orange:#ff8f1f;--blue:#1d79d1;--ink:#11233c;--muted:#617184;--line:#dbe5f0}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
      background:linear-gradient(180deg,#f4f7fb,#e8eef8);
    }
    .page{
      width:760px;
      height:560px;
      margin:0 auto;
      padding:10px 18px 12px;
      display:grid;
      gap:10px;
      overflow:hidden;
    }
    .pair{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:12px;
      align-items:start;
      margin-top:-6px;
    }
    .card{
      width:240px;
      border-radius:20px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 18px 40px rgba(17,35,60,.18);
      border:1px solid var(--line);
      position:relative;
    }
    .front{
      min-height:308px;
      background:
        radial-gradient(circle at 50% 78%,rgba(255,143,31,.18),transparent 22%),
        linear-gradient(180deg,#fff 0 46%,#fff8ef 46% 100%);
    }
    .front:before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:72px;
      background:var(--navy);
    }
    .front:after{
      content:"";
      position:absolute;
      right:-42px;
      top:88px;
      width:128px;
      height:128px;
      border-radius:50%;
      background:var(--orange);
      opacity:.92;
    }
    .head{
      padding:10px 12px 0;
      position:relative;
      z-index:1;
      color:#fff;
      text-align:center;
      font-size:12px;
      font-weight:700;
    }
    .head .small{font-size:9px;font-weight:400;opacity:.9}
    .photo{
      width:80px;
      height:98px;
      margin:14px auto 0;
      border-radius:12px;
      overflow:hidden;
      border:4px solid #fff;
      background:#dfe8f4;
      box-shadow:0 10px 18px rgba(17,35,60,.12);
      position:relative;
      z-index:1;
    }
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .name{
      margin-top:8px;
      text-align:center;
      font-size:15px;
      font-weight:700;
      position:relative;
      z-index:1;
    }
    .sub{
      text-align:center;
      font-size:9px;
      color:var(--blue);
      font-weight:700;
      letter-spacing:.05em;
      position:relative;
      z-index:1;
    }
    .list{
      padding:8px 12px 0;
      font-size:8px;
      line-height:1.35;
      color:#30465f;
      position:relative;
      z-index:1;
    }
    .footer{
      padding:8px 12px 10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      position:relative;
      z-index:1;
    }
    .sig{
      font-size:8px;
      color:#51606d;
    }
    .qr{
      width:50px;
      height:50px;
      border-radius:8px;
      background:
        repeating-linear-gradient(90deg,#10233b 0 3px,transparent 3px 6px),
        repeating-linear-gradient(0deg,#10233b 0 3px,transparent 3px 6px),
        #f7fafc;
      border:3px solid #ebeff3;
    }
    .back{
      min-height:308px;
      background:
        linear-gradient(180deg,#fff,#fbfdff);
    }
    .back .head{
      background:linear-gradient(90deg,var(--orange),var(--blue));
      color:#fff;
      padding:8px 12px;
      font-size:11px;
      font-weight:700;
      text-align:left;
    }
    .back .body{
      padding:10px 12px;
      font-size:8px;
      line-height:1.35;
      color:#30465f;
    }
    .rule{
      border:1px solid var(--line);
      border-radius:12px;
      padding:8px 10px;
      background:#fff;
      margin-bottom:6px;
    }
    .barcode{
      height:38px;
      border-radius:8px;
      background:
        repeating-linear-gradient(90deg,#0f172a 0 3px,transparent 3px 7px),
        linear-gradient(180deg,#fff,#edf2f8);
      border:1px solid #d6e2ef;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="pair">
      <section class="card front">
        <div class="head"><div data-school>GOVT. HIGH SEC.</div><div class="small">Student Identity Card</div></div>
        <div class="photo"><img data-photo alt="Student photo" hidden></div>
        <div class="name" data-name>Student Name</div>
        <div class="sub">STUDENT ID CARD</div>
        <div class="list">
          <div>Name : <strong data-name>--</strong></div>
          <div>Father : <strong data-parent>--</strong></div>
          <div>ID No : <strong data-admission>--</strong></div>
          <div>Date of Birth : <strong data-dob>--</strong></div>
          <div>Blood Group : <strong data-blood>--</strong></div>
          <div>Class : <strong data-class>--</strong> | Sec <strong data-section>--</strong></div>
        </div>
        <div class="footer">
          <div class="sig">Principal</div>
          <div class="qr"></div>
        </div>
      </section>
      <section class="card back">
        <div class="head">Back Side / Terms</div>
        <div class="body">
          <div class="rule">Phone: <strong data-phone>--</strong></div>
          <div class="rule">Address: <strong data-address>--</strong></div>
          <div class="rule">Emergency: <strong data-emergency>--</strong></div>
          <div class="rule">Transport: <strong data-route>--</strong></div>
        </div>
      </section>
    </div>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    const set = (sel, val) => document.querySelectorAll(sel).forEach((n) => (n.textContent = val || "--"));
    const img = p.get("photo");
    if (img) {
      const el = document.querySelector("[data-photo]");
      if (el) {
        el.src = img;
        el.hidden = false;
      }
    }
    set("[data-school]", p.get("school"));
    set("[data-name]", p.get("name"));
    set("[data-class]", p.get("className"));
    set("[data-section]", p.get("section"));
    set("[data-admission]", p.get("admissionNo"));
    set("[data-blood]", p.get("bloodGroup"));
    set("[data-dob]", p.get("dob"));
    set("[data-phone]", p.get("phone"));
    set("[data-parent]", p.get("parent"));
    set("[data-route]", p.get("route"));
    set("[data-address]", p.get("address"));
    set("[data-emergency]", p.get("emergency"));
    if (p.get("print") === "1") {
      window.addEventListener("load", () => setTimeout(() => window.print(), 250));
      window.addEventListener("afterprint", () => window.close());
    }
  </script>
  <script src="./idcard-common.js"></script>
</body>
</html>
