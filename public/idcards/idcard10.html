<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Card Template 10</title>
  <style>
    :root{--maroon:#6b1f2f;--orange:#ff8f1f;--ink:#1d2530;--muted:#637182;--line:#e7d8dc}
    *{box-sizing:border-box} html,body{width:100%;height:100%;overflow:hidden}
    body{margin:0;background:linear-gradient(180deg,#f1ecef,#faf8f9);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    .page{width:760px;height:560px;margin:0 auto;padding:18px;display:grid;gap:18px;overflow:hidden}
    .card{width:272px;margin:0 auto;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 16px 34px rgba(107,31,47,.2);border:1px solid var(--line)}
    .front{background:#fff}
    .top{background:var(--maroon);color:#fff;padding:8px 10px;text-align:center;font-size:12px;font-weight:700}
    .school{background:#f7f0f2;color:var(--maroon);text-align:center;padding:8px 10px;font-size:12px;font-weight:700}
    .photo{width:96px;height:118px;margin:8px auto;border-radius:10px;overflow:hidden;background:#e9eef5;border:3px solid var(--orange)}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .name{text-align:center;font-size:18px;font-weight:700;margin:4px 0}
    .row{padding:0 12px 4px;font-size:10px;line-height:1.45;color:#374151}
    .row strong{color:var(--ink)}
    .footer{background:linear-gradient(180deg,#fff 0,#fff5ec 100%);padding:8px 12px;border-top:4px solid var(--orange)}
    .sig{text-align:right;font-size:10px;color:#333;margin-top:8px}
    .back{width:272px;margin:0 auto;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 16px 34px rgba(107,31,47,.2);border:1px solid var(--line)}
    .back .head{background:var(--orange);padding:8px 10px;color:#fff;font-size:11px;font-weight:700;text-align:center}
    .back .body{padding:10px 12px;font-size:9px;line-height:1.5;color:#2e3c4d}
    .barcode{height:52px;margin-top:8px;border-radius:10px;background:repeating-linear-gradient(90deg,#6b1f2f 0 3px,transparent 3px 7px),linear-gradient(180deg,#fff,#f1f5f9)}
  </style>
</head>
<body>
  <div class="page">
    <section class="card front">
      <div class="top" data-school>RADIANT SCHOOL & COLLEGE</div>
      <div class="school">STUDENT ID CARD</div>
      <div class="photo"><img data-photo alt="Student photo" hidden></div>
      <div class="name" data-name>Student Name</div>
      <div class="row">Name : <strong data-name>--</strong></div>
      <div class="row">Father : <strong data-parent>--</strong></div>
      <div class="row">ID No : <strong data-admission>--</strong></div>
      <div class="row">Date of Birth : <strong data-dob>--</strong></div>
      <div class="row">Blood Group : <strong data-blood>--</strong></div>
      <div class="row">Phone : <strong data-phone>--</strong></div>
      <div class="row">Address : <strong data-address>--</strong></div>
      <div class="footer"><div class="sig">Principal</div></div>
    </section>
    <section class="back">
      <div class="head">Emergency / Details</div>
      <div class="body">
        <div>Class : <strong data-class>--</strong></div>
        <div>Section : <strong data-section>--</strong></div>
        <div>Emergency : <strong data-emergency>--</strong></div>
        <div>Transport : <strong data-route>--</strong></div>
        <div class="barcode"></div>
      </div>
    </section>
  </div>
  <script>
    const p=new URLSearchParams(location.search),set=(sel,val)=>document.querySelectorAll(sel).forEach(n=>n.textContent=val||"--"),img=p.get("photo");
    if(img){const e=document.querySelector("[data-photo]");if(e){e.src=img;e.hidden=false}}
    set("[data-school]",p.get("school"));set("[data-name]",p.get("name"));set("[data-class]",p.get("className"));set("[data-section]",p.get("section"));set("[data-admission]",p.get("admissionNo"));set("[data-blood]",p.get("bloodGroup"));set("[data-dob]",p.get("dob"));set("[data-phone]",p.get("phone"));set("[data-parent]",p.get("parent"));set("[data-route]",p.get("route"));set("[data-address]",p.get("address"));set("[data-emergency]",p.get("emergency"));
    if (p.get("print") === "1") {
      window.addEventListener("load", () => setTimeout(() => window.print(), 250));
      window.addEventListener("afterprint", () => window.close());
    }
  </script>
  <script src="./idcard-common.js"></script>
</body>
</html>
