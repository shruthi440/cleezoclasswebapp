<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Card Template 11</title>
  <style>
    :root{--navy:#163a73;--cyan:#0ea5e9;--ink:#10233b;--muted:#5c7086;--line:#dbe4f0}
    *{box-sizing:border-box} html,body{width:100%;height:100%;overflow:hidden}
    body{margin:0;background:linear-gradient(180deg,#f0f6ff,#e8f0fb);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    .page{width:760px;height:560px;margin:0 auto;padding:18px;display:grid;gap:18px;overflow:hidden}
    .card{width:304px;margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(22,58,115,.18);border:1px solid var(--line)}
    .front{display:grid;grid-template-columns:104px 1fr;min-height:206px}
    .side{background:linear-gradient(180deg,var(--navy),#0d2a57);color:#fff;padding:12px;display:grid;align-content:space-between}
    .logo{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:700}
    .side .school{font-size:10px;line-height:1.35}
    .body{padding:12px;display:grid;gap:8px}
    .name{font-size:18px;font-weight:700}
    .meta{font-size:10px;color:var(--muted);line-height:1.45}
    .photo{width:72px;height:86px;border-radius:10px;overflow:hidden;border:4px solid #eef5ff;background:#dfe8f4}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
    .field{padding:6px 8px;border-radius:10px;background:#f7fbff;border:1px solid #e4ecf7;font-size:9px;line-height:1.35}
    .field strong{display:block;font-size:10px;color:var(--ink)}
    .bar{height:6px;border-radius:999px;background:linear-gradient(90deg,var(--navy),var(--cyan))}
    .back{width:304px;margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(22,58,115,.18);border:1px solid var(--line)}
    .back .head{background:linear-gradient(90deg,var(--navy),var(--cyan));color:#fff;padding:8px 12px;font-size:11px;font-weight:700}
    .back .body{padding:10px 12px;font-size:9px;line-height:1.45;color:#31455d}
    .barcode{height:44px;margin-top:8px;border-radius:10px;background:repeating-linear-gradient(90deg,#163a73 0 3px,transparent 3px 6px),linear-gradient(180deg,#fff,#edf3fa)}
  </style>
</head>
<body>
  <div class="page">
    <section class="card front">
      <div class="side">
        <div class="logo" data-school-short>SC</div>
        <div class="school"><div data-school>School Name</div><div>Student ID Card</div></div>
      </div>
      <div class="body">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div>
            <div class="name" data-name>Student Name</div>
            <div class="meta">Class <strong data-class>--</strong> | Sec <strong data-section>--</strong></div>
          </div>
          <div class="photo"><img data-photo alt="Student photo" hidden></div>
        </div>
        <div class="grid">
          <div class="field">Admission No <strong data-admission>--</strong></div>
          <div class="field">Roll No <strong data-roll>--</strong></div>
          <div class="field">Blood <strong data-blood>--</strong></div>
          <div class="field">Phone <strong data-phone>--</strong></div>
          <div class="field" style="grid-column:1/-1">Parent <strong data-parent>--</strong></div>
          <div class="field" style="grid-column:1/-1">Address <strong data-address>--</strong></div>
        </div>
        <div class="bar"></div>
      </div>
    </section>
    <section class="back">
      <div class="head">Back / Emergency</div>
      <div class="body">
        <div>Emergency Contact: <strong data-emergency>--</strong></div>
        <div>Transport: <strong data-route>--</strong></div>
        <div>Date of Birth: <strong data-dob>--</strong></div>
        <div class="barcode"></div>
      </div>
    </section>
  </div>
  <script>
    const p=new URLSearchParams(location.search),set=(sel,val)=>document.querySelectorAll(sel).forEach(n=>n.textContent=val||"--"),img=p.get("photo");
    if(img){const e=document.querySelector("[data-photo]");if(e){e.src=img;e.hidden=false}}
    set("[data-school]",p.get("school"));set("[data-name]",p.get("name"));set("[data-class]",p.get("className"));set("[data-section]",p.get("section"));set("[data-admission]",p.get("admissionNo"));set("[data-roll]",p.get("rollNo"));set("[data-blood]",p.get("bloodGroup"));set("[data-dob]",p.get("dob"));set("[data-phone]",p.get("phone"));set("[data-parent]",p.get("parent"));set("[data-route]",p.get("route"));set("[data-address]",p.get("address"));set("[data-emergency]",p.get("emergency"));
    if (p.get("print") === "1") {
      window.addEventListener("load", () => setTimeout(() => window.print(), 250));
      window.addEventListener("afterprint", () => window.close());
    }
  </script>
  <script src="./idcard-common.js"></script>
</body>
</html>
