<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ID Card Template 9</title>
  <style>
    :root{--blue:#1f4fd1;--orange:#ff9a1f;--ink:#16324f;--muted:#60758a;--line:#d4deeb}
    *{box-sizing:border-box} html,body{width:100%;height:100%;overflow:hidden}
    body{margin:0;background:linear-gradient(180deg,#f4f7fb 0,#eef3fb 100%);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    .page{width:760px;height:560px;margin:0 auto;padding:18px;display:grid;gap:18px;overflow:hidden}
    .card{width:252px;margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(22,50,79,.18);border:1px solid var(--line)}
    .front{background:linear-gradient(180deg,var(--blue) 0 42%,#fff 42% 100%)}
    .brand{padding:10px 12px 0;color:#fff;font-size:12px;font-weight:700;text-align:center}
    .brand .small{font-size:9px;font-weight:400}
    .photo{width:84px;height:104px;margin:8px auto 0;border:3px solid #fff;border-radius:4px;overflow:hidden;background:#dfe8f4}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .body{padding:8px 12px 12px;text-align:center}
    .name{font-size:15px;font-weight:700;margin-top:6px}
    .cls{font-size:10px;color:#1f4fd1;font-weight:700;letter-spacing:.04em}
    .list{margin-top:8px;text-align:left;font-size:9px;line-height:1.45;color:#2b425d}
    .sign{margin-top:10px;font-size:9px;text-align:right;color:#4f6070}
    .wave{height:16px;background:linear-gradient(135deg,#fff 20%,transparent 20% 40%,#fff 40% 60%,transparent 60% 80%,#fff 80%);opacity:.2}
    .back{width:252px;margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(22,50,79,.18);border:1px solid var(--line)}
    .back .header{background:#2b58b5;color:#fff;padding:10px 12px;font-size:11px;font-weight:700}
    .back .body{padding:10px 12px}
    .back .body .rule{font-size:9px;line-height:1.45;margin-bottom:6px}
    .barcode{height:52px;margin-top:8px;border-radius:10px;background:repeating-linear-gradient(90deg,#16324f 0 3px,transparent 3px 6px),linear-gradient(180deg,#fff,#edf2f8)}
    .pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eaf0ff;color:#1f4fd1;font-size:9px;font-weight:700}
  </style>
</head>
<body>
  <div class="page">
    <section class="card front">
      <div class="brand" data-school>RADIANT SCHOOL & COLLEGE<div class="small">A home of quality & morality</div></div>
      <div class="photo"><img data-photo alt="Student photo" hidden></div>
      <div class="body">
        <div class="name" data-name>Student Name</div>
        <div class="cls">STUDENT ID CARD</div>
        <div class="list">
          <div>Name : <strong data-name>--</strong></div>
          <div>Father : <strong data-parent>--</strong></div>
          <div>ID No. : <strong data-admission>--</strong></div>
          <div>Date of Birth : <strong data-dob>--</strong></div>
          <div>Blood Group : <strong data-blood>--</strong></div>
          <div>Phone : <strong data-phone>--</strong></div>
          <div>Address : <strong data-address>--</strong></div>
        </div>
        <div class="sign">Principal</div>
      </div>
      <div class="wave"></div>
    </section>
    <section class="back">
      <div class="header">Back Side</div>
      <div class="body">
        <div class="rule">Class : <strong data-class>--</strong> | Section : <strong data-section>--</strong></div>
        <div class="rule">Emergency Contact: <strong data-emergency>--</strong></div>
        <div class="rule"><span class="pill">Verified Student</span></div>
        <div class="barcode"></div>
      </div>
    </section>
  </div>
  <script>
    const p=new URLSearchParams(location.search),set=(sel,val)=>document.querySelectorAll(sel).forEach(n=>n.textContent=val||"--"),img=p.get("photo");
    if(img){const e=document.querySelector("[data-photo]");if(e){e.src=img;e.hidden=false}}
    set("[data-school]",p.get("school"));set("[data-name]",p.get("name"));set("[data-class]",p.get("className"));set("[data-section]",p.get("section"));set("[data-admission]",p.get("admissionNo"));set("[data-blood]",p.get("bloodGroup"));set("[data-dob]",p.get("dob"));set("[data-phone]",p.get("phone"));set("[data-parent]",p.get("parent"));set("[data-address]",p.get("address"));set("[data-emergency]",p.get("emergency"));
    if (p.get("print") === "1") {
      window.addEventListener("load", () => setTimeout(() => window.print(), 250));
      window.addEventListener("afterprint", () => window.close());
    }
  </script>
  <script src="./idcard-common.js"></script>
</body>
</html>
